version: "3.8"

services:
  datero-wuaylluy:
    build:
      context: .
      dockerfile: Dockerfile
    image: datero-wuaylluy:latest
    container_name: datero-wuaylluy
    restart: unless-stopped
    ports:
      - "127.0.0.1:5004:8080"
    environment:
      - TZ=America/Lima
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: app-net
    external: true
